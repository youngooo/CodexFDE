name: Workbench Eval Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  blocking-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLOWERP_PROJECT_ROOT: ${{ github.workspace }}/.runtime/flowerp-project
      L08_REPORT_DIR: _ci_reports/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbench
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Check workbench installation
        run: python -X utf8 -m workbench.cli environment-check

      # Course integration tests read customer source. Pin it so a product update
      # cannot silently change this repository's regression baseline.
      - name: Checkout independent FlowERP test baseline
        uses: actions/checkout@v4
        with:
          repository: congde/flowERP
          ref: e0088d3a11ae68b7e23c2c6986167b87768d909e
          path: .runtime/flowerp-project
          persist-credentials: false
      - name: Install and check independent customer environment
        run: |
          python -m venv "$FLOWERP_PROJECT_ROOT/.venv"
          "$FLOWERP_PROJECT_ROOT/.venv/bin/python" -m pip install -e "$FLOWERP_PROJECT_ROOT"
          python -X utf8 -m workbench.cli environment-check --product
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        continue-on-error: true  # L08 A: intentional false-green propagation defect
        run: python -X utf8 -m unittest discover -s tests -v
      - name: L08 selected Harness
        if: ${{ !cancelled() }}
        env:
          FLOWERP_PROJECT_ROOT: ${{ github.workspace }}
        run: |
          mkdir -p "$L08_REPORT_DIR"
          python -X utf8 -m eval.harness --suite blocking \
            --case stock_never_negative \
            --case sales_credit_and_atomic_reservation \
            --case ci_evidence_envelope_is_honest \
            --case l08_candidate_atomic_reservation \
            --report-path "$L08_REPORT_DIR/harness-l08.json"
      - name: Local course experiments
        if: ${{ !cancelled() }}
        continue-on-error: true  # The L08 snapshot intentionally omits later-lesson experiment files.
        run: python -B -X utf8 scripts/audit_course_experiments.py --output-dir .runtime/course-experiments-ci
      - name: Upload course experiment process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-experiment-process-evidence
          path: .runtime/course-experiments-ci/*.json
          if-no-files-found: warn
          include-hidden-files: true
      - name: Browser state tests
        if: ${{ !cancelled() }}
        run: node --test tests/*.test.cjs
      - name: Unified blocking gate
        if: ${{ !cancelled() }}
        run: python -X utf8 -m eval.harness --suite blocking
      - name: Bind Evidence Envelope to this run
        if: always()
        run: python -X utf8 -m workbench.ci_evidence --report "$L08_REPORT_DIR/harness-l08.json" --output "$L08_REPORT_DIR/ci-evidence.json"
      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l08-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.L08_REPORT_DIR }}/harness-l08.json
            ${{ env.L08_REPORT_DIR }}/ci-evidence.json
          if-no-files-found: error
          include-hidden-files: true
