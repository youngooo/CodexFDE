<svg xmlns="http://www.w3.org/2000/svg" width="1275" height="520"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#ac803c"/></marker></defs><rect width="1275" height="520" fill="#faf9f6"/><rect x="5" y="20" width="385" height="215" fill="#e9f0f6" stroke="#a9bac7"/><text x="19" y="61" font-family="Microsoft YaHei" font-size="26" font-weight="700" fill="#172a3e">① 执行是否正常结束？</text><text x="19" y="106" font-family="Microsoft YaHei" font-size="23" font-weight="700" fill="#a87b37">工作台读取执行记录</text><text x="19" y="139" font-family="Microsoft YaHei" font-size="22" font-weight="400" fill="#172a3e">核对退出码、超时和异常。</text><text x="19" y="172" font-family="Microsoft YaHei" font-size="22" font-weight="400" fill="#172a3e">退出码 0 只说明进程正常结束，</text><text x="19" y="205" font-family="Microsoft YaHei" font-size="22" font-weight="400" fill="#172a3e">尚不能证明改动符合要求。</text><path d="M400 118h28" stroke="#ac803c" stroke-width="4" marker-end="url(#a)"/><text x="13" y="291" font-family="Microsoft YaHei" font-size="24" font-weight="700" fill="#985537">异常或超时：停止交付</text><text x="13" y="325" font-family="Microsoft YaHei" font-size="22" font-weight="400" fill="#172a3e">保留日志和部分结果。</text><text x="13" y="359" font-family="Microsoft YaHei" font-size="22" font-weight="400" fill="#172a3e">排错后重新执行，再做检查。</text><rect x="445" y="20" width="385" height="215" fill="#e9f0f6" stroke="#a9bac7"/><text x="459" y="61" font-family="Microsoft YaHei" font-size="26" font-weight="700" fill="#172a3e">② 改动是否符合要求？</text><text x="459" y="106" font-family="Microsoft YaHei" font-size="23" font-weight="700" fill="#a87b37">独立复验者借助工作台检查</text><text x="459" y="139" font-family="Microsoft YaHei" font-size="22" font-weight="400" fill="#172a3e">对照 Spec 核对范围与实际输出，</text><text x="459" y="172" font-family="Microsoft YaHei" font-size="22" font-weight="400" fill="#172a3e">运行最小 Eval。通过仅覆盖</text><text x="459" y="205" font-family="Microsoft YaHei" font-size="22" font-weight="400" fill="#172a3e">本次实际检查的输入和断言。</text><path d="M840 118h28" stroke="#ac803c" stroke-width="4" marker-end="url(#a)"/><text x="453" y="291" font-family="Microsoft YaHei" font-size="24" font-weight="700" fill="#985537">检查失败：退回修订</text><text x="453" y="325" font-family="Microsoft YaHei" font-size="22" font-weight="400" fill="#172a3e">说明哪项要求未满足。</text><text x="453" y="359" font-family="Microsoft YaHei" font-size="22" font-weight="400" fill="#172a3e">修订后重新检查新版本。</text><rect x="885" y="20" width="385" height="215" fill="#e6f0ee" stroke="#a9bac7"/><text x="899" y="61" font-family="Microsoft YaHei" font-size="26" font-weight="700" fill="#172a3e">③ 审核者是否接受？</text><text x="899" y="106" font-family="Microsoft YaHei" font-size="23" font-weight="700" fill="#a87b37">具名审核者作出决定</text><text x="899" y="139" font-family="Microsoft YaHei" font-size="22" font-weight="400" fill="#172a3e">核对同一版本的改动与报告，</text><text x="899" y="172" font-family="Microsoft YaHei" font-size="22" font-weight="400" fill="#172a3e">判断需求与剩余风险。</text><text x="899" y="205" font-family="Microsoft YaHei" font-size="22" font-weight="400" fill="#172a3e">明确接受后才进入后续交付。</text><text x="893" y="291" font-family="Microsoft YaHei" font-size="24" font-weight="700" fill="#985537">尚未接受：区分等待与返工</text><text x="893" y="325" font-family="Microsoft YaHei" font-size="22" font-weight="400" fill="#172a3e">无人决定：保持待审核。</text><text x="893" y="359" font-family="Microsoft YaHei" font-size="22" font-weight="400" fill="#172a3e">明确拒绝：按理由返工并复验。</text><text x="8" y="438" font-family="Microsoft YaHei" font-size="26" font-weight="700" fill="#a87b37">例：退出码 0，但多修改了未授权的 README</text><text x="8" y="480" font-family="Microsoft YaHei" font-size="24" font-weight="400" fill="#172a3e">第①步正常，第②步因越界失败，退回修订；不能把“执行成功”直接当作“已接受”。</text></svg>