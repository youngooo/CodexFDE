<svg xmlns="http://www.w3.org/2000/svg" width="1275" height="155"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#ac803c"/></marker></defs><rect width="1275" height="155" fill="#faf9f6"/><rect x="5" y="5" width="385" height="145" fill="#e9f0f6" stroke="#a9bac7"/><text x="19" y="43" font-family="Microsoft YaHei" font-size="26" font-weight="700" fill="#172a3e">① 输入：两条库存明细</text><text x="19" y="91" font-family="Microsoft YaHei" font-size="23" font-weight="400" fill="#172a3e">先西仓：在库 12、预占 4。</text><text x="19" y="122" font-family="Microsoft YaHei" font-size="23" font-weight="400" fill="#172a3e">后东仓：在库 8、预占 3。</text><path d="M400 76h28" stroke="#ac803c" stroke-width="4" marker-end="url(#a)"/><rect x="445" y="5" width="385" height="145" fill="#e9f0f6" stroke="#a9bac7"/><text x="459" y="43" font-family="Microsoft YaHei" font-size="26" font-weight="700" fill="#172a3e">② 程序：生成明细 CSV</text><text x="459" y="91" font-family="Microsoft YaHei" font-size="23" font-weight="400" fill="#172a3e">按合同排序，逐行减去预占。</text><text x="459" y="122" font-family="Microsoft YaHei" font-size="23" font-weight="400" fill="#172a3e">保留两条明细，不合并商品。</text><path d="M840 76h28" stroke="#ac803c" stroke-width="4" marker-end="url(#a)"/><rect x="885" y="5" width="385" height="145" fill="#e6f0ee" stroke="#a9bac7"/><text x="899" y="43" font-family="Microsoft YaHei" font-size="26" font-weight="700" fill="#172a3e">③ 同伴：读回实际文件</text><text x="899" y="91" font-family="Microsoft YaHei" font-size="23" font-weight="400" fill="#172a3e">用 CSV 读取器解析字段。</text><text x="899" y="122" font-family="Microsoft YaHei" font-size="23" font-weight="400" fill="#172a3e">与预期结果逐列、逐行比较。</text></svg>