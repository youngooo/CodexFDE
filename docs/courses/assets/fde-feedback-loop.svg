<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">FDE 现场、交付、能力闭环</title><desc id="desc">FlowERP 现场问题触发受控交付，证据回流后升级工作台，再服务下一次现场。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#475569"/></marker></defs><rect width="1100" height="720" fill="#fffdf8"/>
  <text x="550" y="65" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#172b4d">FDE：现场、交付、能力三循环</text>
  <g font-family="Microsoft YaHei,sans-serif" text-anchor="middle" fill="#172b4d"><rect x="410" y="110" width="280" height="100" rx="18" fill="#e6f6ec" stroke="#2f855a" stroke-width="3"/><text x="550" y="150" font-size="21" font-weight="700">FlowERP 现场问题</text><text x="550" y="183" font-size="16">用户、数据、运行后果</text>
  <rect x="740" y="310" width="300" height="110" rx="18" fill="#fff3d6" stroke="#e09f3e" stroke-width="3"/><text x="890" y="350" font-size="21" font-weight="700">受控交付</text><text x="890" y="385" font-size="16">Spec · 写集 · Codex · Eval · 人审</text>
  <rect x="400" y="520" width="300" height="110" rx="18" fill="#f1e8ff" stroke="#8b5cf6" stroke-width="3"/><text x="550" y="560" font-size="21" font-weight="700">证据回流</text><text x="550" y="595" font-size="16">失败 · 修订 · 摘要 · 反馈</text>
  <rect x="60" y="310" width="300" height="110" rx="18" fill="#e8f1ff" stroke="#3b82f6" stroke-width="3"/><text x="210" y="350" font-size="21" font-weight="700">工作台升级</text><text x="210" y="385" font-size="16">规则、Eval 与编排能力</text>
  <ellipse cx="550" cy="365" rx="120" ry="65" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><text x="550" y="355" font-size="19" font-weight="700">人负责</text><text x="550" y="388" font-size="16">取舍 · 授权 · 复验</text></g>
  <path d="M680 185 C800 205 870 245 885 300" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M885 420 C840 490 760 545 710 560" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M400 575 C310 555 235 490 215 430" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M205 310 C245 220 330 170 400 160" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="550" y="690" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#b42318">不是模型自动进化；是团队把失败变成下一次可复用的工程能力</text>
</svg>
