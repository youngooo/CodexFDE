<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="720" viewBox="0 0 1360 720" role="img" aria-labelledby="title desc">
  <title id="title">个人研发自动化工作台四阶段能力增长</title><desc id="desc">从工作台 V0 到质量证据链、受控协作、产品化与反馈。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#475569"/></marker></defs><rect width="1360" height="720" fill="#fffdf8"/>
  <text x="50" y="65" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#172b4d">工作台能力由现场问题逼出，不是工具目录</text>
  <g font-family="Microsoft YaHei,sans-serif" text-anchor="middle" fill="#172b4d"><rect x="60" y="130" width="270" height="210" rx="18" fill="#e8f1ff" stroke="#3b82f6" stroke-width="3"/><text x="195" y="180" font-size="22" font-weight="700">L01–L04｜Workbench V0</text><text x="195" y="240" font-size="18">规则 → Spec → 受控执行</text><text x="195" y="292" font-size="16">第一次交付库存导出</text>
  <rect x="380" y="130" width="270" height="210" rx="18" fill="#fff3d6" stroke="#e09f3e" stroke-width="3"/><text x="515" y="180" font-size="22" font-weight="700">L05–L08｜质量证据链</text><text x="515" y="240" font-size="18">Eval → Harness → Hook → CI</text><text x="515" y="292" font-size="16">让失败稳定、分级、可下载</text>
  <rect x="700" y="130" width="270" height="210" rx="18" fill="#f1e8ff" stroke="#8b5cf6" stroke-width="3"/><text x="835" y="180" font-size="22" font-weight="700">L09–L12｜受控协作</text><text x="835" y="240" font-size="17">Repair → Loop → Subagents → Graph</text><text x="835" y="292" font-size="16">边界、停止、冲突、具名人审</text>
  <rect x="1020" y="130" width="270" height="210" rx="18" fill="#e6f6ec" stroke="#2f855a" stroke-width="3"/><text x="1155" y="180" font-size="22" font-weight="700">L13–L16｜产品化与反馈</text><text x="1155" y="240" font-size="16">Task API → Web → Feedback → Bootstrap</text><text x="1155" y="292" font-size="16">让陌生人消费并继续交付</text></g>
  <path d="M330 235 H370" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M650 235 H690" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M970 235 H1010" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <rect x="210" y="450" width="940" height="90" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="680" y="492" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#172b4d">每次升级都回到 FlowERP 验真</text><text x="680" y="522" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#334155">正常路径 + 主动失败 + 失败后状态 + 他人复验</text>
  <text x="680" y="615" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#b42318">最终绿灯不等于学生构造过程；术语数量不等于挑战度</text>
</svg>
