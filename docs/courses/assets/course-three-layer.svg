<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc">
  <title id="title">Codex、个人研发自动化工作台与 FlowERP 的三层关系</title>
  <desc id="desc">Codex 提供开发能力，工作台组织受控交付，FlowERP 用业务冲突验证工作台；人负责取舍、授权、审核和签收。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="1160" height="650" fill="#fffdf8"/>
  <text x="60" y="70" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#172b4d">课程唯一主线</text>
  <rect x="80" y="190" width="240" height="150" rx="18" fill="#e8f1ff" stroke="#3b82f6" stroke-width="3"/>
  <text x="200" y="245" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#172b4d">Codex</text><text x="200" y="285" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="18" fill="#334155">AI 开发伙伴</text>
  <rect x="410" y="150" width="340" height="230" rx="22" fill="#fff3d6" stroke="#e09f3e" stroke-width="4"/>
  <text x="580" y="220" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#172b4d">个人研发自动化工作台</text><text x="580" y="265" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="19" fill="#334155">课程主体</text><text x="580" y="315" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="17" fill="#334155">Spec · 权限 · Eval · 协作 · 证据</text>
  <rect x="840" y="190" width="240" height="150" rx="18" fill="#e6f6ec" stroke="#2f855a" stroke-width="3"/>
  <text x="960" y="245" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#172b4d">FlowERP</text><text x="960" y="285" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="18" fill="#334155">客户产品与验证场</text>
  <path d="M320 250 H400" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="360" y="230" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#334155">提供能力</text>
  <path d="M750 250 H830" stroke="#e09f3e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="790" y="230" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#334155">组织交付</text>
  <path d="M960 340 V440 H580 V390" stroke="#2f855a" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#arrow)"/><text x="780" y="430" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#2f855a">冲突、失败与反馈回流</text>
  <rect x="300" y="500" width="560" height="70" rx="14" fill="#f5f5f5" stroke="#64748b" stroke-width="2"/><text x="580" y="543" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="19" font-weight="700" fill="#172b4d">人负责：业务取舍 · 授权 · 具名审核 · 最终签收</text>
  <text x="580" y="610" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#b42318">不是三个并列产品；工作台也不是 FlowERP 员工门户</text>
</svg>
