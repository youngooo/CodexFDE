<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540"><rect width="100%" height="100%" fill="#FAF9F6"/><g font-family="Microsoft YaHei" fill="#18283D"><text x="60" y="65" font-size="35" font-weight="bold">FDE：用客户问题检验产品，也检验交付工具</text><rect x="60.0" y="120" width="413.3333333333333" height="140" rx="10" fill="#EAF0F5"/><text x="78.0" y="158" font-size="28" font-weight="bold">现场确认</text><text x="78.0" y="198" font-size="24">A 重试是否为新收货？</text><text x="78.0" y="231" font-size="24">人确认业务身份与损失</text><rect x="513.3333333333333" y="120" width="413.3333333333333" height="140" rx="10" fill="#EAF0F5"/><text x="531.3333333333333" y="158" font-size="28" font-weight="bold">发现能力缺口</text><text x="531.3333333333333" y="198" font-size="24">库存 28，却重复写流水</text><text x="531.3333333333333" y="231" font-size="24">旧检查只看返回值</text><rect x="966.6666666666666" y="120" width="413.3333333333333" height="140" rx="10" fill="#EAF0F5"/><text x="984.6666666666666" y="158" font-size="28" font-weight="bold">升级工作台</text><text x="984.6666666666666" y="198" font-size="24">新 Eval 观察完整状态</text><text x="984.6666666666666" y="231" font-size="24">同一缺陷连续两次红</text><rect x="60.0" y="305" width="413.3333333333333" height="140" rx="10" fill="#EAF0F5"/><text x="78.0" y="343" font-size="28" font-weight="bold">组织产品修复</text><text x="78.0" y="383" font-size="24">工作台约束候选与范围</text><text x="78.0" y="416" font-size="24">Codex 修入库逻辑</text><rect x="513.3333333333333" y="305" width="413.3333333333333" height="140" rx="10" fill="#EAF0F5"/><text x="531.3333333333333" y="343" font-size="28" font-weight="bold">原检查复验与审核</text><text x="531.3333333333333" y="383" font-size="24">库存与流水正确才交接</text><text x="531.3333333333333" y="416" font-size="24">人决定接受或返工</text><rect x="966.6666666666666" y="305" width="413.3333333333333" height="140" rx="10" fill="#EAF0F5"/><text x="984.6666666666666" y="343" font-size="28" font-weight="bold">后续任务再采用</text><text x="984.6666666666666" y="383" font-size="24">记录方法、版本与边界</text><text x="984.6666666666666" y="416" font-size="24">复用后再评价和修订</text><text x="478.3333333333333" y="195" font-size="30" fill="#A67B40">→</text><text x="931.6666666666665" y="195" font-size="30" fill="#A67B40">→</text><text x="478.3333333333333" y="380" font-size="30" fill="#A67B40">→</text><text x="931.6666666666665" y="380" font-size="30" fill="#A67B40">→</text><text x="60" y="508" font-size="25">产品仍错 → 修产品；检查漏判 → 补判据；范围失控 → 修工作台控制。</text><path d="M 1173 260 V 282 H 266 V 299" fill="none" stroke="#A67B40" stroke-width="2"/><path d="M 260 295 L 266 305 L 272 295" fill="#A67B40"/></g></svg>